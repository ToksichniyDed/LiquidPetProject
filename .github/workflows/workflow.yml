name: workflow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        preset: [debug-gcc, release-gcc]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Conan
        run: pipx install conan

      - name: Detect Conan profile
        run: conan profile detect --force

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-${{ runner.os }}-${{ matrix.preset }}-${{ hashFiles('conanfile.txt') }}
          restore-keys: |
            conan-${{ runner.os }}-${{ matrix.preset }}-

      - name: Conan install
        run: |
          BUILD_TYPE=$([ "${{ matrix.preset }}" = "debug-gcc" ] && echo "Debug" || echo "Release")
          conan install . --build=missing -s build_type=$BUILD_TYPE -of=build/${{ matrix.preset }}

      - name: Configure CMake
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -j $(nproc)

      - name: Run tests
        run: ctest --preset ${{ matrix.preset }}