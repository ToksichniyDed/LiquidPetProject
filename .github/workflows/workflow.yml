name: workflow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: debug-gcc
            build_type: debug
          - preset: release-gcc
            build_type: release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Conan
        run: pipx install conan

      - name: Make scripts executable
        run: chmod +x conan/scripts/*.sh

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-${{ runner.os }}-${{ matrix.preset }}-${{ hashFiles('conanfile.txt', 'conan/profiles/*.profile') }}
          restore-keys: |
            conan-${{ runner.os }}-${{ matrix.preset }}-

      - name: Install Conan dependencies
        run: ./conan/scripts/install_conan_${{ matrix.build_type }}.sh

      - name: Configure CMake
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -j $(nproc)

      - name: Run unit tests
        run: ctest --preset ${{ matrix.preset }} --output-on-failure -LE integration

  integration-test:
    runs-on: ubuntu-26.04
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Conan
        run: pipx install conan

      - name: Make scripts executable
        run: chmod +x conan/scripts/*.sh

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-${{ runner.os }}-debug-gcc-${{ hashFiles('conanfile.txt', 'conan/profiles/*.profile') }}
          restore-keys: |
            conan-${{ runner.os }}-debug-gcc-

      - name: Install Conan dependencies
        run: ./conan/scripts/install_conan_debug.sh

      - name: Configure CMake
        run: cmake --preset debug-gcc

      - name: Build
        run: cmake --build --preset debug-gcc -j $(nproc)

      - name: Start infrastructure
        run: docker compose up -d --wait order-postgres worker-postgres kafka

      - name: Install dbmate
        run: |
          curl -fsSL -o /usr/local/bin/dbmate https://github.com/amacneil/dbmate/releases/latest/download/dbmate-linux-amd64
          chmod +x /usr/local/bin/dbmate

      - name: Run order-service migrations
        env:
          DATABASE_URL: postgres://orders:orders@localhost:5432/orders?sslmode=disable
        run: dbmate --migrations-dir order-service/db/migrations up

      - name: Run worker-service migrations
        env:
          DATABASE_URL: postgres://worker:worker@localhost:5433/worker?sslmode=disable
        run: dbmate --migrations-dir worker-service/db/migrations up

      - name: Run integration tests
        env:
          ORDER_SERVICE_DATABASE_URL: postgres://orders:orders@localhost:5432/orders?sslmode=disable
          WORKER_SERVICE_DATABASE_URL: postgres://worker:worker@localhost:5433/worker?sslmode=disable
          KAFKA_BROKERS: localhost:9092
        run: ctest --preset debug-gcc --output-on-failure -L integration

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs order-postgres worker-postgres kafka

      - name: Stop infrastructure
        if: always()
        run: docker compose down -v

  e2e-test:
    runs-on: ubuntu-26.04
    needs: build-and-test
    # Без "needs: build-and-test": e2e собирает образы внутри Docker и от сборки на раннере
    # не зависит, поэтому идёт параллельно.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create .env
        run: make env

      # Драйвер docker-container нужен для экспорта кэша в GHA
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Собираем образы сервисов bake'ом с кэшем слоёв. Слои conan install
      # переиспользуются, пока не менялись conanfile.txt, профиль и скрипт установки.
      - name: Build service images
        uses: docker/bake-action@v7
        with:
          source: .
          files: docker-compose.yaml
          targets: order-service,worker-service,gateway
          load: true
          set: |
            order-service.cache-from=type=gha,scope=e2e-order-service
            order-service.cache-to=type=gha,scope=e2e-order-service,mode=max
            worker-service.cache-from=type=gha,scope=e2e-worker-service
            worker-service.cache-to=type=gha,scope=e2e-worker-service,mode=max
            gateway.cache-from=type=gha,scope=e2e-gateway
            gateway.cache-to=type=gha,scope=e2e-gateway,mode=max

      # Образы уже загружены в локальный docker, повторная сборка не нужна
      - name: Start system
        run: docker compose up -d --wait --no-build

      - name: Run E2E tests
        run: make pytest

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop services
        if: always()
        run: docker compose down -v
