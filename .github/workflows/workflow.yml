name: workflow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: debug-gcc
            build_type: debug
          - preset: release-gcc
            build_type: release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Conan
        run: pipx install conan

      - name: Make scripts executable
        run: chmod +x conan/scripts/*.sh

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-${{ runner.os }}-${{ matrix.preset }}-${{ hashFiles('conanfile.txt', 'conan/profiles/*.profile') }}
          restore-keys: |
            conan-${{ runner.os }}-${{ matrix.preset }}-

      - name: Install Conan dependencies
        run: ./conan/scripts/install_conan_${{ matrix.build_type }}.sh

      - name: Configure CMake
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -j $(nproc)

      - name: Run tests
        run: ctest --preset ${{ matrix.preset }} --output-on-failure